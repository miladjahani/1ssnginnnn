# MILICONFIG - Nginx Reverse Proxy Configuration
# Optimized for bypassing censorship & filtering in Iran by reverse-proxying to Railway

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream Railway Backend
    # Replace with your actual Railway domain: e.g. milinewc2-production.up.railway.app
    upstream railway_backend {
        server milinewc2-production.up.railway.app:443;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.com; # Replace with your custom domain or VPS IP

        # Redirect plain HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name your-domain.com; # Replace with your custom domain or VPS IP

        # SSL Certificates (Let's Encrypt / Certbot paths)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Anti-DPI / Zero-Buffering for Instant Real-Time Ping
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # WebSocket / VLESS / Trojan Proxy Location
        location / {
            proxy_pass https://railway_backend;

            # CRITICAL: Forward SNI and Host to Railway
            proxy_set_header Host milinewc2-production.up.railway.app;
            proxy_ssl_server_name on;
            proxy_ssl_name milinewc2-production.up.railway.app;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # WebSocket Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Client Identity Headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Timeouts for persistent proxy streaming (prevents ping timeout)
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # Subscriptions and Panel Passthrough
        location ~ ^/(sub|api|static|login) {
            proxy_pass https://railway_backend;
            proxy_set_header Host milinewc2-production.up.railway.app;
            proxy_ssl_server_name on;
            proxy_ssl_name milinewc2-production.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
